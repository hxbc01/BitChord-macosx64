name: Desktop

# Builds the native desktop app. This fork exists to keep the macOS Intel
# (x64) build alive after upstream replaced desktopApp with the web player, so
# the workflow runs on the one Intel macOS runner GitHub still provides.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp, without the leading v
        required: false
        default: "1.8.1"
  push:
    tags:
      - 'v*'

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-x64:
    name: macOS x64
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve the version
        id: version
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Write local.properties
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER }}
        run: |
          : > local.properties
          if [ -n "$LASTFM_API_KEY" ]; then echo "LASTFM_API_KEY=$LASTFM_API_KEY" >> local.properties; fi
          if [ -n "$LASTFM_SECRET" ]; then echo "LASTFM_SECRET=$LASTFM_SECRET" >> local.properties; fi
          if [ -n "$LISTEN_TOGETHER_SERVER" ]; then echo "LISTEN_TOGETHER_SERVER=$LISTEN_TOGETHER_SERVER" >> local.properties; fi

      - run: chmod +x gradlew

      - name: Build the disk image
        run: ./gradlew :desktopApp:packageDmg -Pbitchord.version=${{ steps.version.outputs.value }}

      - name: Name the disk image
        run: |
          mkdir -p dist
          cp desktopApp/build/compose/binaries/main/dmg/*.dmg \
            "dist/BitChord-${{ steps.version.outputs.value }}-macos-x64.dmg"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: bitchord-macos-x64-dmg
          path: dist/*.dmg
